name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          ini-file: production

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          run-install: false

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Configure Composer authentication
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          COMPOSER_AUTH_INPUT: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -n "$GH_PAT" ]; then
            composer config --global github-oauth.github.com "$GH_PAT"
          fi
          if [ -n "$COMPOSER_AUTH_INPUT" ]; then
            {
              echo 'COMPOSER_AUTH<<EOF'
              printf '%s\n' "$COMPOSER_AUTH_INPUT"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          elif [ -n "$GH_PAT" ]; then
            echo "COMPOSER_AUTH={\"github-oauth\":{\"github.com\":\"$GH_PAT\"}}" >> "$GITHUB_ENV"
          fi

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      - name: Detect Playwright requirement
        id: playwright
        run: |
          MODE="auto"
          if [ "$MODE" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "false" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(find tests/Browser -name '*.php' ! -name '.gitkeep' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$COUNT" -gt 0 ]; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "needed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Get Playwright version
        id: playwright-version
        if: steps.playwright.outputs.needed == 'true'
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        if: steps.playwright.outputs.needed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright.outputs.needed == 'true'
        run: bunx playwright install

      - name: Install Playwright System Dependencies
        if: steps.playwright.outputs.needed == 'true'
        run: bunx playwright install-deps

      - name: Cache Rector
        uses: actions/cache@v5
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@v5
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create Cache Directories
        run: mkdir -p /tmp/rector /tmp/phpstan

      - name: Tests
        run: composer test

      - name: Store Artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: warn
